name: Auto Update Assets List

on:
  push:
    paths:
      - 'assets/**' # assetsフォルダ内が変わった時だけ実行（節約）
  workflow_dispatch: # ボタンで手動実行も可能にする

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # リポジトリのコードを取得

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate JSON
        run: |
          node scripts/generate-json.js
          # 🌟 ここで直接タイムスタンプを書き込む
          date "+%Y-%m-%d %H:%M:%S" > assets/last_update.txt

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # assets/ 以下の変更されたファイルをすべてステージング
          git add assets/list.json assets/last_update.txt
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: update assets and timestamp"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi